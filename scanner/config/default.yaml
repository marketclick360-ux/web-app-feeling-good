# Default scanner configuration.
# Values mirror scanner/params.py and the dataclass defaults in code; this file
# documents them in one place. Edit params.py to change behavior in code.

# Top-level configurable parameters (see scanner/params.py)
params:
  MIN_PRICE: 10                       # USD; exclude sub-$10 names
  MIN_AVG_DOLLAR_VOLUME: 20000000     # $20M, trailing 20 sessions
  EARNINGS_EXCLUSION_DAYS: 10         # trading days around earnings (when calendar available)
  MIN_PROFIT_FACTOR: 1.30
  MIN_OOS_TRADES: 100
  PREFERRED_OOS_TRADES: 300

data:
  source: synthetic                   # synthetic | csv | polygon
  benchmark: SPY
  years: 10
  resolution_trend: 1d                # primarily daily-bar swing system
  # NOTE: document the exact OHLCV + corporate-actions sources, the adjustment
  # methodology, the daily-close timestamp/timezone, and whether results are
  # price-return or total-return in every report (see RESEARCH_REPORT.md).
  signal_close: "16:00 America/New_York"
  execution: "signals from close of bar t fill at the open of bar t+1"

costs:                                # slippage PER SIDE, applied to entry & exit
  scenarios:
    low: 0.0005                       # 0.05%
    normal: 0.0010                    # 0.10%
    stressed: 0.0025                  # 0.25% — acceptance must hold here
  acceptance_scenario: stressed
  commission_per_share: 0.005
  min_commission: 1.0
  sec_taf_bps: 0.02                   # regulatory fees on sells
  spread_bps: 2.0                     # half-spread per side
  delay_bars: 1

risk:                                 # MODERATE profile
  risk_per_trade_pct: 0.01            # 1.0% (band 0.25%–1.0%)
  max_total_open_risk_pct: 0.06
  max_stressed_open_risk_pct: 0.09
  gap_tail_multiplier: 1.5
  max_sector_risk_pct: 0.08
  max_positions: 8
  daily_loss_limit_r: 3.0
  weekly_loss_limit_r: 6.0

validation:
  splits: {development: 0.5, out_of_sample: 0.3, holdout: 0.2}
  bootstrap_iterations: 2000
  placebo_runs: 100
  # Acceptance is NOT based on a fixed reward-to-risk target. A setup is
  # accepted only on: positive net expectancy after stressed costs, profit
  # factor >= MIN_PROFIT_FACTOR, adequate sample, consistency across years and
  # regimes, concentration-test survival, and placebo-test advantage.
