name: backtest-validation

# Runs the FULL backtest-gate validation on REAL data (Yahoo by default) on a
# GitHub-hosted runner, which has internet access — so you can get your
# BACKTEST_VALIDATION.md without a local terminal. Trigger it from the Actions
# tab ("Run workflow") or it can be triggered via the API. The report is
# printed to the log AND uploaded as a downloadable artifact.

on:
  # Manual trigger (Actions tab) once the workflow is on the default branch.
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        default: "yahoo"
        type: choice
        options: ["yahoo", "stooq"]
      years:
        description: "Years of history"
        default: "6"
      symbols:
        description: "Number of symbols"
        default: "30"
  # Also runs whenever THIS workflow file changes — so editing it kicks off a
  # fresh validation run (handy when workflow_dispatch isn't available on a
  # feature branch). Other commits do NOT trigger it.
  # (re-trigger: mtf v2 basket run — indices, sectors, megacaps, gold/bonds)
  push:
    paths:
      - '.github/workflows/backtest-validation.yml'

permissions:
  contents: write   # lets the run commit the trade spreadsheets back to the branch

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (+ yfinance for the Yahoo source)
        run: pip install -r requirements.txt yfinance
      - name: Run exit-target research on real data
        run: |
          mkdir -p validation_out
          SRC="${{ github.event.inputs.source || 'yahoo' }}"
          YRS="${{ github.event.inputs.years || '6' }}"
          SYM="${{ github.event.inputs.symbols || '30' }}"
          python -m scanner.cli exits \
            --source "$SRC" --years "$YRS" --symbols "$SYM" \
            --small-account --etf-only --fast \
            --out-dir validation_out | tee validation_out/exits_console.txt
      - name: Run the DEFENSIVE swing model (6 exits x 4 filters + risk controls)
        run: |
          mkdir -p validation_out
          SRC="${{ github.event.inputs.source || 'yahoo' }}"
          YRS="${{ github.event.inputs.years || '6' }}"
          SYM="${{ github.event.inputs.symbols || '30' }}"
          python -m scanner.cli defensive \
            --source "$SRC" --years "$YRS" --symbols "$SYM" \
            --small-account --etf-only --fast \
            --out-dir validation_out | tee validation_out/defensive_console.txt
      - name: Run the TACTICAL SIGNAL RADAR backtest (5 entries, canonical exits)
        run: |
          mkdir -p validation_out
          python -m scanner.cli radar --source yahoo --years 15 \
            --out-dir validation_out | tee validation_out/radar_console.txt
      - name: RADAR survivorship check — ETF-only universe
        run: |
          mkdir -p validation_out/radar_etf
          python -m scanner.cli radar --source yahoo --years 15 \
            --ticker GLD --ticker SMH --ticker XLE --ticker SPY --ticker DIA \
            --ticker XLF --ticker XLK --ticker QQQ --ticker IWM --ticker TLT \
            --ticker XLV --ticker XLI --ticker XLY --ticker XLP --ticker EEM \
            --ticker EFA --ticker MDY --ticker XLB --ticker XLU \
            --out-dir validation_out/radar_etf | tee validation_out/radar_etf_console.txt
      - name: Run the ONE-TICKER multi-timeframe model (SPY then QQQ) vs buy-and-hold
        run: |
          mkdir -p validation_out
          SRC="${{ github.event.inputs.source || 'yahoo' }}"
          python -m scanner.cli mtf --source "$SRC" --years 15 \
            --ticker SPY --ticker QQQ --ticker DIA --ticker IWM \
            --ticker XLK --ticker XLV --ticker XLF --ticker XLE --ticker SMH \
            --ticker AAPL --ticker MSFT --ticker GLD --ticker TLT \
            --out-dir validation_out | tee validation_out/mtf_console.txt
      - name: Print the reports to the log
        run: |
          echo "==================== MTF_MODEL.md ===================="
          cat validation_out/MTF_MODEL.md 2>/dev/null || true
          echo "==================== DEFENSIVE_MODEL.md ===================="
          cat validation_out/DEFENSIVE_MODEL.md 2>/dev/null || true
      - name: Upload report + CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-validation
          path: scanner/validation_out/
      - name: Commit the radar trade spreadsheets to the repo
        working-directory: .
        run: |
          mkdir -p scanner/results
          cp scanner/validation_out/radar_trades.csv scanner/results/radar_trades_full_universe.csv || true
          cp scanner/validation_out/radar_etf/radar_trades.csv scanner/results/radar_trades_etf_only.csv || true
          cp scanner/validation_out/RADAR_BACKTEST.md scanner/results/RADAR_BACKTEST.md || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scanner/results   # scanner/.gitignore excludes *.csv; these are deliberate
          git diff --cached --quiet || (git commit -m "data: radar trade spreadsheets from latest backtest run" && git push)
